version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mediscan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediscan_user
      POSTGRES_PASSWORD: mediscan_password
      POSTGRES_DB: mediscan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscan_user -d mediscan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mediscan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mediscan_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://mediscan_user:mediscan_password@postgres:5432/mediscan_db
      - SECRET_KEY=mediscan-production-super-secret-key-32chars-min!
      - ENVIRONMENT=production
      - DEBUG=False
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - FDA_API_KEY=${FDA_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MODEL_PROVIDER=${MODEL_PROVIDER:-grounded_extractive}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data/reports:/app/data/reports

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mediscan_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
